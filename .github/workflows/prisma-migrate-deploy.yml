name: Prisma Migrate Deploy

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub environment name with DATABASE_URL and DIRECT_URL secrets"
        required: true
        type: choice
        options:
          - preview
          - production

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_environment }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || vars.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL != '' && secrets.DIRECT_URL || vars.DIRECT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required DB env values are present
        run: |
          echo "target_environment=${{ github.event.inputs.target_environment }}"
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL is empty. Set it in GitHub Environment secrets or vars for '${{ github.event.inputs.target_environment }}'."
            exit 1
          fi
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::DIRECT_URL is empty. Set it in GitHub Environment secrets or vars for '${{ github.event.inputs.target_environment }}'."
            exit 1
          fi

      - name: Validate Prisma schema
        run: npx prisma validate --schema prisma/schema.prisma

      - name: Select migration connection URL
        run: |
          set -euo pipefail

          probe_with_retry() {
            local url="$1"
            local label="$2"
            local attempts="$3"
            local sleep_seconds="$4"

            for attempt in $(seq 1 "$attempts"); do
              if printf 'SELECT 1;\n' | npx prisma db execute --url "$url" --stdin >/dev/null 2>&1; then
                echo "${label} connectivity verified on attempt ${attempt}."
                return 0
              fi
              echo "${label} not ready (attempt ${attempt}/${attempts}). Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            done

            return 1
          }

          if probe_with_retry "$DIRECT_URL" "DIRECT_URL" 5 8; then
            echo "DIRECT_URL=$DIRECT_URL" >> "$GITHUB_ENV"
            echo "Using DIRECT_URL for migration steps."
            exit 0
          fi

          echo "::warning::DIRECT_URL unreachable from runner. Falling back to DATABASE_URL for this migration run."

          if probe_with_retry "$DATABASE_URL" "DATABASE_URL" 5 8; then
            echo "DIRECT_URL=$DATABASE_URL" >> "$GITHUB_ENV"
            echo "Using DATABASE_URL fallback for migration steps."
            exit 0
          fi

          echo "::error::Unable to reach DIRECT_URL or DATABASE_URL after retries."
          exit 1

      - name: Deploy migrations (with retry)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm run db:migrate:deploy; then
              echo "Migration deploy succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Migration deploy failed (attempt ${attempt}/3). Retrying in 10s..."
            sleep 10
          done
          echo "::error::Migration deploy failed after retries."
          exit 1

      - name: Confirm migration status
        run: npm run db:migrate:status
