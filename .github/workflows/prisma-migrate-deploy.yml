name: Prisma Migrate Deploy

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub environment name with DATABASE_URL and DIRECT_URL secrets"
        required: true
        type: choice
        options:
          - preview
          - production

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_environment }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || vars.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL != '' && secrets.DIRECT_URL || vars.DIRECT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required DB env values are present
        run: |
          echo "target_environment=${{ github.event.inputs.target_environment }}"
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL is empty. Set it in GitHub Environment secrets or vars for '${{ github.event.inputs.target_environment }}'."
            exit 1
          fi
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::DIRECT_URL is empty. Set it in GitHub Environment secrets or vars for '${{ github.event.inputs.target_environment }}'."
            exit 1
          fi

      - name: Validate Prisma schema
        run: npx prisma validate --schema prisma/schema.prisma

      - name: Deploy migrations
        run: npm run db:migrate:deploy

      - name: Confirm migration status
        run: npm run db:migrate:status
